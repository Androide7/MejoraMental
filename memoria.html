  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activando mi Memoria</title>
  <link rel="stylesheet" href="styles3.css">
  <link rel="stylesheet" href="commonn.css">
  <script defer src="verificarSesion.js"></script>
</head>

<body>
  <!-- Barra de navegación -->
  <nav class="barra-ondulada">
    <div class="pestana-inicio" id="toggleMenu">
      <img src="UhP.gif" alt="Inicio">
    </div>

    <div class="linea-ondulada">
      <div class="luz-deslizante" id="light"></div>
    </div>

    <ul class="menu-links" id="menuLinks">
      <li><a href="principal.html">Inicio</a></li>
      <li><a href="raimnth.html">Gotas Infinitas</a></li>
      <li><a href="comparson.html">ColorMatch</a></li>

      <li><a href="speed.html">Reflejo mental</a></li>
      <li><a href="verbs.html">Verbos_inglés</a></li>
    </ul>
  </nav>

  <div id="user-display" class="usuario-derecha"></div>

  <!-- Contenedor para el juego de Memoria -->
  <div id="memoria-container" class="game-box">
    <div class="game-container1">
      <div class="intro">
        <h1>Activando tu memoria</h1>
        <p>Pon a prueba tu memoria recordando el patrón de fichas.</p>
        <button id="startGame">Jugar</button>
      </div>

      <!-- Sección de estadísticas -->
      <div id="stats" class="hidden">
        <p id="errors">Fichas restantes: 5</p>
        <p id="points">Puntos: 0</p>
        <p id="timer">Tiempo restante: 45s</p>
      </div>

      <!-- Tablero del juego -->
      <div id="gameBoard" class="hidden"></div>

      <!-- Mensaje especial si entra al top -->
      <div id="specialMessage" class="top-message hidden"></div>

      <!-- Contenedor de puntuaciones -->
      <div id="highscores-container" class="hidden">
        <h4>🏆 Top 100 Puntuaciones</h4>
        <div class="scroll-wrapper">
          <ul id="highScoresList"></ul>
        </div>
      </div>

    </div>
  </div>
  <!-- Usuarios en línea (sin usar) -->
  <div id="usuarios-en-linea">Usuarios en línea: 0</div>

  <!-- Módulos -->
  <script type="module" src="userOnline.js"></script>
  <script type="module" src="memory.js"></script>
  <script src="script.js"></script>
